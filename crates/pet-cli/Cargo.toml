[package]
name = "pet-cli"
version = "0.1.0"
edition = "2021"
description = "Terminal interface to the pet: single-agent chat, agent switching, group chat"

[dependencies]
pet-core = { path = "../pet-core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
ratatui = "0.29"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
