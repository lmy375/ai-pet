[project]
name = "eval-deep-swe"
version = "0.1.0"
description = "用 DeepSWE benchmark（datacurve-ai/deep-swe，pier 驱动）测 pet-cli 的 coding agent 能力"
requires-python = ">=3.12"
dependencies = [
    "datacurve-pier>=0.3.0",
    "pyyaml>=6",
]

[project.scripts]
eval-deep-swe = "pet_deep_swe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pet_deep_swe"]
