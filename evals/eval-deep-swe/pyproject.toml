[project]
name = "eval-deep-swe"
version = "0.1.0"
description = "用 DeepSWE benchmark（datacurve-ai/deep-swe，pier 驱动）测 pet-cli 的 coding agent 能力"
requires-python = ">=3.12"
dependencies = [
    "datacurve-pier>=0.3.0",
    "pyyaml>=6",
]

[project.scripts]
eval-deep-swe = "pet_deep_swe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pet_deep_swe"]

# PyPI 的 0.3.0 不认 task.toml 的 [[verifier.collect]]（只跑 pre_artifacts.sh），
# deep-swe v1.1 全靠它收 model.patch——没有它一律按空提交判 0 分。
[tool.uv.sources]
datacurve-pier = { git = "https://github.com/datacurve-ai/pier", rev = "df89f994623a0a6a57229103b6fe910766693c30" }
