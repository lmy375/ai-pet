[project]
name = "pet-eval-common"
version = "0.1.0"
description = "eval-deep-swe / eval-terminal-bench 共用的宿主侧小工具：musl 交叉编译、模型解析、容器内 PET_CONFIG_DIR 生成"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pet_eval_common"]
